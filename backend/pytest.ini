# pytest configuration for the backend.
#
# pythonpath: tests import `app.*`, and without this pytest only adds tests/ to sys.path, so the
# package would resolve only when the working directory happened to be backend/. Being explicit means
# `pytest` works from any invocation path, including CI.
[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
filterwarnings =
    # The embedding model prints deprecations we cannot fix; unrelated warnings should not become failures.
    ignore::DeprecationWarning
